name: prek

# ci.yaml から reusable workflow として呼び出される。
# pull_request のトリガーは ci.yaml 側が持つ。
on:
  workflow_call:
    inputs:
      fail-fast:
        description: "失敗時に呼び出し元の run 全体をキャンセルして他の並列チェックを止める"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  # fail-fast step (gh run cancel) に必要。呼び出し元でも同じ権限を付与すること
  # (called workflow の GITHUB_TOKEN は caller の権限を超えられない)
  actions: write

jobs:
  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # check hook の astro check は、CI の中でも、例外で止まるとエラーの内容を telemetry.astro.build へ送る。
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 注意: Actions の許可設定 (allowed_actions: selected の場合) で
      # jdx/mise-action@* を patterns_allowed に許可しておく必要がある。
      # version を指定しないと mise 本体が latest になる。mise が生成する成果物
      # (mise-task-docs hook が README.md へ流し込む `mise generate task-docs` の出力など) は
      # mise のリリースで書式が変わりうるため、latest のままだと無関係な PR の hook が
      # 「files were modified by this hook」で落ちる。mise.toml の [tools] と同じ方針で pin し、
      # bump は renovate.json の customManagers に任せる。
      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.11.4"
          cache: true

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # format / check hook が node_modules の biome と astro を使うため npm ci を先に実行する
      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Run prek
        env:
          # biome には reporter を指定する環境変数が無いので、mise の check タスクが読んで --reporter に渡す。
          BIOME_REPORTER: github
          # gitleaks hook は index の staged の変更だけを走査し、checkout しただけの CI では何も検査しない。履歴は gitleaks.yaml が走査する。
          SKIP: gitleaks
        run: mise exec -- prek run --all-files

      # fail-fast: run 全体をキャンセルして並列で走る他のチェックを止める。
      # run と各 job の conclusion は cancelled になるが、失敗した step は failure として記録に残る。
      - name: Cancel the entire run on failure
        if: failure() && inputs.fail-fast
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

# Node のバージョンは .node-version (メジャーのみ指定) が単一ソース (Cloudflare のビルドも参照する)。
# mise には settings.idiomatic_version_file_enable_tools 経由で読み込ませる。
# ツールのバージョンは Renovate (mise manager) が bump する。latest 指定にしない。
# mise.lock も Renovate が更新する (node のパッチ追従は lockFileMaintenance)。
[tools]
prek = "0.5.10"
actionlint = "1.7.12"
# actionlint は run: のスクリプト検査に PATH 上の shellcheck を使うため、ここで pin して
# CI (runner 同梱版) とローカル (未設定の mise shim を拾うと actionlint ごと失敗する) を同じ版に揃える
shellcheck = "0.11.0"
dprint = "0.64.3"
typos = "1.52.2"
zizmor = "1.32.0"
gitleaks = "8.30.1"
wrangler = "4.158.0"

[tasks.install]
description = "Install npm dependencies"
run = "npm ci"

[tasks.check]
description = "Type-check, lint and check formatting (astro check / tsc / biome)"
run = """
#!/usr/bin/env bash
status=0
npx --no-install astro check --minimumFailingSeverity hint || status=1
# astro check は tsconfig.json 自体の誤り (未知のオプションなど) を報告しない。
npx --no-install tsc --noEmit || status=1
npx --no-install biome check --error-on-warnings ${BIOME_REPORTER:+--reporter="$BIOME_REPORTER"} . || status=1
# Biome は info の診断では失敗しないので、件数を数えて失敗にする (診断の内容は上の biome check が表示する)。
npx --no-install biome lint --reporter=json . 2>/dev/null | node -e '
  const { infos } = JSON.parse(require("node:fs").readFileSync(0, "utf8")).summary;
  if (infos > 0) {
    console.error(`biome: ${infos} info diagnostic(s)`);
    process.exit(1);
  }
' || status=1
exit "$status"
"""

[tasks.format]
description = "Format sources and sort imports and CSS properties with biome"
run = "npx --no-install biome check --write --linter-enabled=false ."

[tasks.clean]
description = "Remove build artifacts (dist/, .astro/)"
run = "rm -rf dist .astro"

# deployment list は 1 回に最新の 1 ページ (25 件) しか返さないため、一覧が空になるまで取得と削除を繰り返す。
# --force は alias (ブランチの URL) が付いたデプロイも削除する。
# 認証は wrangler のログインセッション (`wrangler whoami` で確認) を使う。
[tasks.cleanup-previews]
description = "Delete all Cloudflare Pages preview deployments"
run = '''
#!/usr/bin/env bash
set -euo pipefail
project="portfolio"
deleted=0
while true; do
  list=$(wrangler pages deployment list --project-name "$project" --environment preview)
  # grep は一致が無いと 1、エラーでは 2 を返すので、1 (0 件) だけを正常な結果として扱う
  ids=$({ grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' <<<"$list" || [[ $? -eq 1 ]]; } | sort -u)
  [[ -z "$ids" ]] && break
  for id in $ids; do
    wrangler pages deployment delete "$id" --project-name "$project" --force >/dev/null
    echo "deleted: $id"
    deleted=$((deleted + 1))
  done
done
echo "done: deleted=${deleted}"
'''

[tasks.docs]
description = "Sync the task list embedded in README.md with mise.toml"
run = "mise generate task-docs --inject --output README.md"

[hooks]
postinstall = "prek install"

[settings]
idiomatic_version_file_enable_tools = ["node"]
lockfile = true
